name: Backend

on:
  push:
    branches:
      - "*"
  schedule:
    - cron: "39 12 * * 6"

jobs:
  run-backend-linter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

  run-backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # wrangler.jsonc requires the assets dir, which holds the gitignored frontend build.
      - name: Create assets directory
        run: mkdir -p public

      - name: Test
        run: bun run test
