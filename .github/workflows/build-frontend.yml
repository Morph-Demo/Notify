name: Build frontend

on:
  push:
    branches:
      - "*"
  schedule:
    - cron: "39 12 * * 6"

jobs:
  run-frontend-linter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
